services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payout
      POSTGRES_PASSWORD: payout
      POSTGRES_DB: payout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payout -d payout"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://payout:payout@postgres:5432/payout?sslmode=disable",
        "up"
      ]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      HTTP_PORT: "8080"
      DB_URL: postgres://payout:payout@postgres:5432/payout?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-#hello-world-test-jwt-secret-1899}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PAYOUT_JOB_ENABLED: "true"
      PAYOUT_JOB_CRON: "0 0 1 * *"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
